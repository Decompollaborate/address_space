[package]
name = "address_space"
version = "0.1.1"
edition = "2018"
description = "Crate for working with MIPS address spaces, providing types for managing ROM and VRAM addresses, sizes, and ranges."
authors = [
    "Anghelo Carvajal <angheloalf95@gmail.com>",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Decompollaborate/address_space"
readme = "README.md"
keywords = [
    "address",
    "mips",
    "rom",
    "vram",
]
categories = [
    "no-std",
    "no-std::no-alloc",
]

# Use https://github.com/foresterre/cargo-msrv to check the MSRV
# ```
# cargo install cargo-msrv --locked --force
# cargo msrv find
# ```
rust-version = "1.31"

[features]
default = []

std = []

# Implement TryFrom conversion for some types.
# Bumps the MSRV to 1.34
try_from = []

# Implement the Error trait on error types.
# Bumps the MSRV to 1.81
error = [
    "try_from",
]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[profile.release]
debug = true
